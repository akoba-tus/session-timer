<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Session Timer">
<title>Session Timer</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    --ink: #131a2b;
    --ivory: #f4f1e8;
    --dim: #8c93a6;
    --line: rgba(244, 241, 232, .16);
    --accent: #7fd6c2;
    --clock-scale: 1;
    --bg: var(--ink);
    --fg: var(--ivory);
    --bar: var(--accent);
    --label: var(--dim);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
    transition: background-color .45s ease, color .45s ease;
  }
  body[data-state="warn"] { --bg: #3a2a0b; --fg: #ffd98a; --bar: #e8a33d; --label: #c9a05a; }
  body[data-state="over"] { --bg: #3d0f16; --fg: #ff6f6f; --bar: #ff5a5a; --label: #d08d8d; }

  .screen { height: 100%; display: grid; grid-template-rows: auto 1fr auto auto; align-items: center; }
  .fuse { height: 10px; width: 100%; background: rgba(244, 241, 232, .09); }
  .fuse span { display: block; height: 100%; width: 100%; background: var(--bar); transition: background-color .45s ease; }

  .stage { display: grid; align-content: center; justify-items: center; gap: .25em; padding: 0 4vw; min-height: 0; }
  .phase { font-size: clamp(1.1rem, 4.2vmin, 2.6rem); font-weight: 500; letter-spacing: .04em; color: var(--label); transition: color .45s ease; }
  .clock {
    font-size: calc(min(32vh, 22vw) * var(--clock-scale));
    font-weight: 600;
    line-height: .9;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    letter-spacing: -.03em;
    text-align: center;
  }
  body[data-state="over"] .clock { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { body[data-state="over"] .clock { animation: none; } }
  .next { font-size: clamp(.95rem, 3vmin, 1.7rem); color: var(--label); transition: color .45s ease; text-align: center; }

  .strip {
    display: flex; align-items: center; gap: 10px;
    padding: 8px max(14px, 2vw) 0;
    color: var(--label);
    font-size: clamp(.9rem, 2vmin, 1.1rem);
  }
  .strip[hidden] { display: none; }
  .strip .who { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip button { min-height: 44px; width: 52px; flex: none; padding: 0; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #6b7280; flex: none; }
  .dot[data-on="1"] { background: #7fd6c2; }
  .dot[data-on="0"] { background: #ff5a5a; }

  .desk { display: flex; gap: 10px; padding: 12px max(14px, 2vw) 16px; border-top: 1px solid var(--line); margin-top: 8px; }
  button {
    font: inherit;
    font-size: clamp(1rem, 2.4vmin, 1.35rem);
    font-weight: 500;
    color: var(--fg);
    background: rgba(244, 241, 232, .07);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 10px;
    min-height: 62px;
    flex: 1;
    cursor: pointer;
    transition: background-color .12s ease, opacity .2s ease;
  }
  button:active { background: rgba(244, 241, 232, .2); }
  button:focus-visible { outline: 3px solid var(--bar); outline-offset: 2px; }
  button[disabled] { opacity: .3; }
  button[hidden] { display: none; }
  .primary { flex: 2.2; background: var(--bar); color: #12182a; border-color: transparent; font-weight: 600; }
  .ghost { flex: .9; color: var(--label); }
  .icon { flex: .45; font-size: 1.3rem; }

  .sheet {
    position: fixed; inset: 0;
    background: rgba(8, 11, 20, .94);
    display: none; place-items: center;
    padding: max(20px, env(safe-area-inset-top, 0px)) 20px 20px;
    overflow-y: auto;
  }
  .sheet[open] { display: grid; }
  .panel { width: min(680px, 100%); }
  .panel h2 { font-size: 1.3rem; font-weight: 500; margin: 0 0 18px; color: var(--ivory); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(244, 241, 232, .1); }
  .row p { margin: 0; font-size: 1.15rem; color: var(--ivory); }
  .row small { display: block; color: var(--dim); font-size: .95rem; }
  .stepper { display: flex; align-items: center; gap: 6px; flex: none; }
  .stepper button { min-height: 48px; width: 54px; flex: none; font-size: 1.4rem; padding: 0; }
  .stepper output { min-width: 76px; text-align: center; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .toggle { min-height: 48px; width: 116px; flex: none; }
  .toggle[aria-pressed="true"] { background: var(--accent); color: #12182a; border-color: transparent; }
  .pair { display: flex; gap: 6px; flex: none; }
  .pair button { min-height: 48px; width: 92px; flex: none; }
  .pair button[aria-pressed="true"] { background: var(--accent); color: #12182a; border-color: transparent; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 0 4px; }
  .presets button { flex: none; min-height: 52px; padding: 10px 18px; }
  .done { width: 100%; margin-top: 18px; background: rgba(244, 241, 232, .12); color: var(--ivory); }
  .note { color: var(--dim); font-size: .9rem; margin: 14px 0 0; line-height: 1.6; }
  .manual { color: var(--ivory); font-size: 1.02rem; line-height: 1.7; }
  .manual h3 { font-size: .95rem; font-weight: 500; letter-spacing: .04em; color: var(--dim); margin: 22px 0 8px; }
  .manual h3:first-child { margin-top: 0; }
  .manual ul { margin: 0; padding-left: 1.1em; }
  .manual li { margin: 6px 0; }
  .manual b { font-weight: 600; }
  .manual .credit { margin: 0; color: var(--dim); line-height: 1.5; }
  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 22px);
    transform: translateX(-50%);
    max-width: 90%; padding: 10px 18px; border-radius: 10px;
    background: rgba(8, 11, 20, .92); color: var(--ivory);
    font-size: clamp(.95rem, 2.2vmin, 1.2rem); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .toast[data-show] { opacity: 1; }
  .swatch { display: inline-block; width: .72em; height: .72em; border-radius: 3px; margin-right: .35em; }
</style>
</head>
<body data-state="calm">
<div class="screen">
  <div class="fuse"><span id="fuse"></span></div>

  <main class="stage">
    <div class="phase" id="phase">Ready</div>
    <div class="clock" id="clock">12:00</div>
    <div class="next" id="next"></div>
  </main>

  <div class="strip" id="strip" hidden>
    <span class="dot" id="dot"></span>
    <span class="who" id="who"></span>
    <button id="prevTalk" aria-label="Previous speaker">◀</button>
    <button id="nextTalk" aria-label="Next speaker">▶</button>
  </div>

  <div class="desk">
    <button class="primary" id="go">Start</button>
    <button id="advance" hidden disabled>Q&amp;A</button>
    <button class="ghost" id="reset">Reset</button>
    <button class="ghost" id="open">Settings</button>
    <button class="ghost icon" id="help" aria-label="Help">?</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="panel">
    <h2 id="s-title">Settings</h2>
    <div class="row">
      <p id="s-lang"></p>
      <div class="pair">
        <button id="lang-ja" aria-pressed="true">日本語</button>
        <button id="lang-en" aria-pressed="false">English</button>
      </div>
    </div>
    <div class="row">
      <p id="s-talk"></p>
      <div class="stepper"><button data-step="talk,-1">−</button><output id="v-talk"></output><button data-step="talk,1">＋</button></div>
    </div>
    <div class="row">
      <p id="s-talkBell"></p>
      <div class="stepper"><button data-step="talkBell,-1">−</button><output id="v-talkBell"></output><button data-step="talkBell,1">＋</button></div>
    </div>
    <div class="row">
      <p id="s-qa"></p>
      <div class="stepper"><button data-step="qa,-1">−</button><output id="v-qa"></output><button data-step="qa,1">＋</button></div>
    </div>
    <div class="row">
      <p id="s-qaBell"></p>
      <div class="stepper"><button data-step="qaBell,-1">−</button><output id="v-qaBell"></output><button data-step="qaBell,1">＋</button></div>
    </div>
    <div class="row">
      <p id="s-size"></p>
      <div class="stepper"><button data-step="size,-10">−</button><output id="v-size"></output><button data-step="size,10">＋</button></div>
    </div>
    <div class="row">
      <p id="s-sound"></p>
      <div class="pair">
        <button id="test"></button>
        <button class="toggle" id="t-sound" aria-pressed="true"></button>
      </div>
    </div>
    <div class="row">
      <p id="s-auto"></p>
      <button class="toggle" id="t-auto" aria-pressed="true"></button>
    </div>
    <div class="presets">
      <button data-preset="12,2,3,0"></button>
      <button data-preset="25,2,5,0"></button>
      <button data-preset="40,2,0,0"></button>
    </div>
    <button class="done" id="close"></button>
    <p class="note" id="s-note"></p>
  </div>
</div>

<div class="sheet" id="help-sheet" role="dialog" aria-modal="true">
  <div class="panel">
    <h2 id="h-title"></h2>
    <div class="manual" id="h-body"></div>
    <button class="done" id="h-test"></button>
    <button class="done" id="h-close"></button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var VERSION = "2.4";

  var T = {
    ja: {
      ready: "準備", talk: "発表", qa: "質疑", paused: "（一時停止）",
      plan: function (d) { return "発表 " + d.talk + " 分" + (d.qa > 0 ? " ／ 質疑 " + d.qa + " 分" : ""); },
      qaFollow: function (d) { return d.qa > 0 ? "このあと質疑 " + d.qa + " 分" : ""; },
      talkOver: function (d) { return d.qa > 0 ? "時間です — 次は質疑 " + d.qa + " 分" : "終了してください"; },
      qaRun: "セッション最後のパートです", qaOver: "終了してください",
      start: "開始", pause: "一時停止", resume: "再開", toQa: "質疑へ", startQa: "質疑を開始",
      reset: "リセット", resetConfirm: "もう一度でリセット", settings: "設定", close: "閉じる",
      progNone: "プログラム未取得", progEnd: "プログラム終了",
      restored: "前回の状態から再開しました（ベルを鳴らすには画面のどこかを一度タップ）",
      sTitle: "設定",
      lang: "言語<small>Language</small>",
      talkRow: "発表<small>持ち時間（分）</small>",
      talkBellRow: "発表の予鈴<small>残り何分で鳴らすか（0で無し）</small>",
      qaRow: "質疑<small>持ち時間（分）</small>",
      qaBellRow: "質疑の予鈴<small>残り何分で鳴らすか（0で無し）</small>",
      sizeRow: "文字の大きさ<small>離れた席から見えるように</small>",
      soundRow: "ベル音<small>予鈴1回／発表終了2回／質疑終了3回</small>",
      soundOn: "鳴らす", soundOff: "鳴らさない",
      autoRow: "質疑へ自動で移る<small>切ると「質疑を開始」を押すまで超過時間を表示</small>",
      autoOn: "自動", autoOff: "手動",
      preset: function (a, b) { return a + "＋" + b + "分"; },
      test: "試聴",
      note: "設定はこの端末に保存されます。プログラムに持ち時間が書かれている発表は、そちらが優先されます。",
      hTitle: "使い方", hClose: "閉じる", hTest: "ベルを鳴らして音量を確認",
      hBody: [
        "<h3>進行</h3><ul>",
        "<li><b>開始</b>を押すと発表のカウントダウンが始まります</li>",
        "<li>終了が近づくと予鈴が1回鳴り、画面が琥珀色になります</li>",
        "<li>発表終了でベル2回。そのまま質疑のタイマーに切り替わります</li>",
        "<li>質疑終了でベル3回。以降は赤字で超過時間をカウントアップします</li>",
        "<li>早く終わったときは<b>質疑へ</b>。残った時間は質疑に繰り越されます</li>",
        "<li>逆に超過した分は質疑から差し引かれます。どちらの場合もセッション全体の持ち時間は変わりません</li>",
        "</ul>",
        "<h3>画面の色</h3><ul>",
        "<li><span class='swatch' style='background:#7fd6c2'></span>紺 … 通常</li>",
        "<li><span class='swatch' style='background:#e8a33d'></span>琥珀 … まもなく終了</li>",
        "<li><span class='swatch' style='background:#ff5a5a'></span>赤 … 時間切れ・超過中</li>",
        "</ul>",
        "<h3>本番前の確認</h3><ul>",
        "<li>下の<b>ベルを鳴らして音量を確認</b>を一度押してください（iOSは一度タップするまで音が出ません）</li>",
        "<li>マナーモードがオンだと鳴りません</li>",
        "<li>自動ロックを「なし」にしてください</li>",
        "</ul>",
        "<h3>その他</h3><ul>",
        "<li><b>リセット</b>は誤操作防止のため2回タップです</li>",
        "<li>外付けキーボードならスペースキーで開始・一時停止できます</li>",
        "<li>誤って閉じたりリロードしたりしても、開き直せば続きから再開します</li>",
        "</ul>"
      ].join(""),
      hNet: function (room) {
        return "<h3>会場モニタ</h3><ul>" +
          "<li>このタイマーは会場「" + esc(room) + "」として事務局に状態を送っています</li>" +
          "<li>ボタン上の点が緑なら送信中、赤なら通信なし。通信がなくてもタイマーはそのまま動きます</li>" +
          "<li><b>リセット</b>すると次の発表者に進みます。順番がずれたら ◀ ▶ で合わせてください</li>" +
          "</ul>";
      },
      hCredit: "<h3>作者</h3><p class='credit'>IWN2026<br>Atsushi Kobayashi<br>MIT License</p>"
    },
    en: {
      ready: "Ready", talk: "Talk", qa: "Questions", paused: " — paused",
      plan: function (d) { return "Talk " + d.talk + " min" + (d.qa > 0 ? " · Questions " + d.qa + " min" : ""); },
      qaFollow: function (d) { return d.qa > 0 ? "Questions " + d.qa + " min to follow" : ""; },
      talkOver: function (d) { return d.qa > 0 ? "Time is up — questions " + d.qa + " min next" : "Please close the session"; },
      qaRun: "Last part of the session", qaOver: "Please close the session",
      start: "Start", pause: "Pause", resume: "Resume", toQa: "Q&A", startQa: "Start questions",
      reset: "Reset", resetConfirm: "Tap again to reset", settings: "Settings", close: "Close",
      progNone: "Programme not loaded", progEnd: "End of programme",
      restored: "Resumed where you left off (tap anywhere once to re-enable the bell)",
      sTitle: "Settings",
      lang: "Language<small>言語</small>",
      talkRow: "Talk<small>length in minutes</small>",
      talkBellRow: "Talk warning<small>minutes before the end (0 = off)</small>",
      qaRow: "Questions<small>length in minutes</small>",
      qaBellRow: "Questions warning<small>minutes before the end (0 = off)</small>",
      sizeRow: "Text size<small>so it reads from the back of the room</small>",
      soundRow: "Bell<small>1 warning · 2 end of talk · 3 end of session</small>",
      soundOn: "On", soundOff: "Off",
      autoRow: "Start questions automatically<small>if off, overtime is shown until you tap Start questions</small>",
      autoOn: "Auto", autoOff: "Manual",
      preset: function (a, b) { return a + "+" + b + " min"; },
      test: "Test",
      note: "Settings are stored on this device. Where the programme gives a talk its own length, that length is used.",
      hTitle: "How to use", hClose: "Close", hTest: "Ring the bell to check the volume",
      hBody: [
        "<h3>Running a session</h3><ul>",
        "<li><b>Start</b> begins the countdown for the talk</li>",
        "<li>One bell and an amber screen warn that the end is near</li>",
        "<li>Two bells at the end of the talk; the discussion timer starts automatically</li>",
        "<li>Three bells at the end of the discussion, then overtime counts up in red</li>",
        "<li><b>Q&amp;A</b> moves on early; the unused talk time is carried over to the discussion</li>",
        "<li>Overtime is taken out of the discussion instead. Either way the slot keeps its total length</li>",
        "</ul>",
        "<h3>Screen colours</h3><ul>",
        "<li><span class='swatch' style='background:#7fd6c2'></span>Navy — running normally</li>",
        "<li><span class='swatch' style='background:#e8a33d'></span>Amber — nearly out of time</li>",
        "<li><span class='swatch' style='background:#ff5a5a'></span>Red — time is up, counting over</li>",
        "</ul>",
        "<h3>Before the session</h3><ul>",
        "<li>Tap <b>Ring the bell to check the volume</b> below — on iOS no sound plays until the page has been tapped once</li>",
        "<li>The bell is silent if the device is on silent mode</li>",
        "<li>Set auto-lock to Never</li>",
        "</ul>",
        "<h3>Also</h3><ul>",
        "<li><b>Reset</b> needs two taps, so a running timer is not lost by accident</li>",
        "<li>With a keyboard attached, the space bar starts and pauses</li>",
        "<li>If the page is closed or reloaded by mistake, reopening it carries on where it left off</li>",
        "</ul>"
      ].join(""),
      hNet: function (room) {
        return "<h3>Room monitor</h3><ul>" +
          "<li>This timer reports to the conference office as room “" + esc(room) + "”</li>" +
          "<li>The dot above the buttons is green while connected and red when offline. The timer keeps running either way</li>" +
          "<li><b>Reset</b> moves on to the next speaker. If the order slips, use ◀ ▶</li>" +
          "</ul>";
      },
      hCredit: "<h3>Credits</h3><p class='credit'>IWN2026<br>Atsushi Kobayashi<br>MIT License</p>"
    }
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---- room monitor (optional, enabled by ?room=&key=&db=) ---- */
  function slug(s) { return String(s).trim().replace(/[.#$\[\]\/\s]+/g, "_") || "room"; }
  var HUB = null;
  (function () {
    var q = new URLSearchParams(location.search);
    var room = q.get("room"), key = q.get("key"), db = q.get("db");
    if (!room || !key || !db) return;
    db = db.trim().replace(/\/+$/, "");
    if (!/^https?:\/\//.test(db)) db = "https://" + db;
    HUB = { room: room, id: slug(room), key: key, db: db };
  })();
  function hubUrl(path) { return HUB.db + "/events/" + encodeURIComponent(HUB.key) + path + ".json"; }

  /* ---- settings ---- */
  var STORE = "session-timer-v3" + (HUB ? ":" + HUB.id : "");
  var DEFAULTS = { talk: 12, talkBell: 2, qa: 3, qaBell: 0, sound: true, auto: true, lang: "ja", size: 100 };
  var S = Object.assign({}, DEFAULTS);
  try {
    var saved = localStorage.getItem(STORE) || localStorage.getItem("session-timer-v3");
    if (saved) S = Object.assign(S, JSON.parse(saved));
  } catch (e) {}
  function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
  function L() { return T[S.lang] || T.ja; }

  /* ---- programme ---- */
  var PROG = "session-timer-prog" + (HUB ? ":" + HUB.id : "");
  var program = [], idx = 0, current = null, startedAt = null;
  try {
    var pj = JSON.parse(localStorage.getItem(PROG) || "null");
    if (pj && Array.isArray(pj.program)) { program = pj.program; idx = pj.idx || 0; }
  } catch (e) {}
  function saveProg() { try { localStorage.setItem(PROG, JSON.stringify({ program: program, idx: idx })); } catch (e) {} }

  var el = {};
  ["clock", "phase", "next", "fuse", "go", "advance", "reset", "open", "close", "sheet", "test",
   "s-title", "s-lang", "s-talk", "s-talkBell", "s-qa", "s-qaBell", "s-size", "s-sound", "s-auto", "s-note",
   "t-sound", "t-auto", "lang-ja", "lang-en",
   "help", "help-sheet", "h-title", "h-body", "h-test", "h-close",
   "strip", "who", "dot", "prevTalk", "nextTalk", "toast"].forEach(function (id) { el[id] = document.getElementById(id); });

  var phase = "idle", running = false, deadline = 0, left = 0, total = 0;
  var rangWarn = false, rangEnd = false, resetArmed = 0;

  function entry() { return phase === "idle" ? program[idx] || null : current; }
  function durs() {
    var e = entry(), d = { talk: S.talk, qa: S.qa };
    if (e) {
      if (typeof e.talk === "number" && e.talk > 0) d.talk = e.talk;
      if (typeof e.qa === "number" && e.qa >= 0) d.qa = e.qa;
    }
    return d;
  }

  /* ---- running state survives a reload ---- */
  var STATE = "session-timer-state" + (HUB ? ":" + HUB.id : "");
  var MAX_AGE = 3 * 3600000;
  function saveState() {
    try {
      localStorage.setItem(STATE, JSON.stringify({
        phase: phase, running: running, deadline: deadline, left: left, total: total,
        rangWarn: rangWarn, rangEnd: rangEnd, current: current, startedAt: startedAt,
        idx: idx, at: Date.now()
      }));
    } catch (e) {}
  }
  function applyState(st) {
    if (!st || !st.phase || Date.now() - (st.at || 0) > MAX_AGE) return false;
    if (typeof st.idx === "number" && st.idx >= 0) idx = st.idx;
    if (st.phase === "idle") return false;
    if (st.running && typeof st.deadline !== "number") return false;
    phase = st.phase; running = !!st.running;
    deadline = st.deadline || 0; left = st.left || 0; total = st.total || 1;
    rangWarn = !!st.rangWarn; rangEnd = !!st.rangEnd;
    current = st.current || null; startedAt = st.startedAt || null;
    return true;
  }
  function fromSnapshot(r) {
    if (!r || !r.phase) return null;
    var ms = r.running ? r.deadline - Date.now() : (r.left || 0);
    var warn = (r.phase === "talk" ? S.talkBell : S.qaBell) * 60000;
    return {
      phase: r.phase, running: !!r.running, deadline: r.deadline, left: r.left, total: r.total,
      rangWarn: !(warn > 0 && ms > warn), rangEnd: ms <= 0,
      current: r.phase === "idle" ? null : { time: r.time, speaker: r.speaker, title: r.title, talk: r.talkMin, qa: r.qaMin },
      startedAt: r.startedAt, idx: r.idx, at: r.sent
    };
  }
  var toastTimer = null, toasted = false;
  function toast(text) {
    if (toasted) return;
    toasted = true;
    el.toast.textContent = text;
    el.toast.setAttribute("data-show", "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.removeAttribute("data-show"); }, 6000);
  }
  function commit() { saveState(); push(); }

  /* ---- bell ---- */
  var ac = null;
  function audio() {
    if (!ac) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      ac = new Ctx();
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function strike(at) {
    var c = audio();
    if (!c) return;
    var t = c.currentTime + at;
    [[784, 0.5, "sine"], [1568, 0.22, "sine"], [2350, 0.1, "triangle"]].forEach(function (p) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = p[2];
      o.frequency.setValueAtTime(p[0], t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(p[1], t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 2);
    });
  }
  function bell(n) { if (S.sound) for (var i = 0; i < n; i++) strike(i * 0.62); }
  function unlock() { audio(); if (running) keepAwake(); }
  document.addEventListener("click", unlock, true);
  document.addEventListener("touchend", unlock, true);

  /* ---- keep the screen on ---- */
  var lock = null;
  function keepAwake() {
    if (!navigator.wakeLock || lock) return;
    navigator.wakeLock.request("screen").then(function (l) {
      lock = l;
      l.addEventListener("release", function () { lock = null; });
    }).catch(function () {});
  }

  /* ---- reporting ---- */
  function setNet(ok) { if (el.dot) el.dot.dataset.on = ok ? "1" : "0"; }
  function snapshot() {
    var d = durs(), e = entry();
    return {
      room: HUB.room,
      phase: phase, running: running,
      deadline: running ? deadline : null,
      left: running ? null : left,
      total: total,
      talkMin: d.talk, qaMin: d.qa,
      warnTalk: S.talkBell, warnQa: S.qaBell,
      idx: idx, count: program.length,
      time: (e && e.time) || "", speaker: (e && e.speaker) || "", title: (e && e.title) || "",
      startedAt: phase === "idle" ? null : startedAt,
      sent: Date.now(),
      seen: { ".sv": "timestamp" },
      v: VERSION
    };
  }
  function push() {
    if (!HUB) return;
    try {
      fetch(hubUrl("/rooms/" + encodeURIComponent(HUB.id)), {
        method: "PUT", body: JSON.stringify(snapshot()), keepalive: true
      }).then(function (r) { setNet(r.ok); }).catch(function () { setNet(false); });
    } catch (e) { setNet(false); }
  }
  function fetchProgram() {
    if (!HUB) return;
    try {
      fetch(hubUrl("/program/" + encodeURIComponent(HUB.id)), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (list) {
          setNet(true);
          if (!list) return;
          if (!Array.isArray(list)) list = Object.keys(list).sort(function (a, b) { return a - b; }).map(function (k) { return list[k]; });
          program = list.filter(Boolean);
          if (idx > program.length) idx = program.length;
          saveProg(); paint(); push();
        })
        .catch(function () { setNet(false); });
    } catch (e) { setNet(false); }
  }
  if (HUB) {
    setInterval(push, 20000);
    setInterval(function () { if (phase === "idle") fetchProgram(); }, 300000);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (running) keepAwake();
    push();
    if (phase === "idle") fetchProgram();
  });

  /* ---- display ---- */
  function fmt(ms) {
    var over = ms < 0;
    var s = over ? Math.floor(-ms / 1000) : Math.floor((ms + 999) / 1000);
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (over ? "+" : "") + (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
  }

  function paintStrip() {
    if (!HUB) { el.strip.hidden = true; return; }
    el.strip.hidden = false;
    var t = L(), e = entry(), body;
    if (!program.length) body = t.progNone;
    else if (!e) body = t.progEnd;
    else body = (idx + 1) + "/" + program.length + "  " +
      [e.time, e.speaker].filter(Boolean).join("  ") + (e.title ? " — " + e.title : "");
    el.who.textContent = HUB.room + "  ·  " + body;
    el.prevTalk.disabled = phase !== "idle" || idx <= 0;
    el.nextTalk.disabled = phase !== "idle" || idx >= program.length;
  }

  function paint() {
    var t = L(), d = durs();
    var ms = running ? deadline - Date.now() : left;
    paintStrip();

    if (phase === "idle") {
      var e = entry();
      el.clock.textContent = fmt(d.talk * 60000);
      el.phase.textContent = t.ready;
      el.next.textContent = (e && e.speaker ? e.speaker + "  ·  " : "") + t.plan(d);
      el.fuse.style.width = "100%";
      document.body.dataset.state = "calm";
      el.go.textContent = t.start;
      el.advance.hidden = true;
      el.advance.disabled = true;
      return;
    }

    el.clock.textContent = fmt(ms);
    el.phase.textContent = (phase === "talk" ? t.talk : t.qa) + (running ? "" : t.paused);

    var warnMs = (phase === "talk" ? S.talkBell : S.qaBell) * 60000;
    document.body.dataset.state = ms <= 0 ? "over" : (warnMs > 0 && ms <= warnMs ? "warn" : "calm");

    if (phase === "talk") el.next.textContent = ms <= 0 ? t.talkOver(d) : t.qaFollow(d);
    else el.next.textContent = ms <= 0 ? t.qaOver : t.qaRun;

    el.fuse.style.width = (ms <= 0 ? 100 : Math.max(0, Math.min(1, ms / total)) * 100) + "%";
    var handOver = (phase === "talk" && running && ms <= 0 && !S.auto && d.qa > 0);
    el.go.textContent = handOver ? t.startQa : (running ? t.pause : t.resume);
    el.advance.hidden = !(phase === "talk" && ms > 0);
    el.advance.disabled = el.advance.hidden;
  }

  function tick() {
    if (!running) return;
    var ms = deadline - Date.now();
    var warnMs = (phase === "talk" ? S.talkBell : S.qaBell) * 60000;
    if (!rangWarn && warnMs > 0 && ms <= warnMs && ms > 0) { rangWarn = true; bell(1); saveState(); }
    if (!rangEnd && ms <= 0) {
      rangEnd = true;
      var noQa = (phase === "talk" && durs().qa <= 0);
      bell(phase === "talk" && !noQa ? 2 : 3);
      saveState();
      if (phase === "talk" && S.auto && !noQa) { start("qa", -ms); return; }
    }
    paint();
  }
  setInterval(tick, 200);

  function start(p, deduct) {
    deduct = deduct || 0;
    if (p === "talk") { current = program[idx] || null; startedAt = Date.now(); }
    phase = p;
    var d = durs();
    var dur = (p === "talk" ? d.talk : d.qa) * 60000;
    var rem = dur - deduct;
    total = Math.max(dur, rem);
    var warnMs = (p === "talk" ? S.talkBell : S.qaBell) * 60000;
    deadline = Date.now() + rem;
    left = rem;
    rangWarn = !(warnMs > 0 && rem > warnMs);
    rangEnd = (rem <= 0);
    running = true;
    audio(); keepAwake(); paint(); commit();
  }

  el.go.addEventListener("click", function () {
    if (phase === "idle") { start("talk"); return; }
    var ms = running ? deadline - Date.now() : left;
    if (phase === "talk" && running && ms <= 0 && !S.auto && durs().qa > 0) { start("qa", -ms); return; }
    if (running) { left = ms; running = false; }
    else { deadline = Date.now() + left; running = true; keepAwake(); }
    paint(); commit();
  });

  el.advance.addEventListener("click", function () {
    if (phase !== "talk") return;
    var ms = running ? deadline - Date.now() : left;
    start("qa", -Math.max(0, ms));
  });

  el.reset.addEventListener("click", function () {
    if (Date.now() > resetArmed) {
      resetArmed = Date.now() + 4000;
      el.reset.textContent = L().resetConfirm;
      setTimeout(function () { if (Date.now() > resetArmed) el.reset.textContent = L().reset; }, 4100);
      return;
    }
    resetArmed = 0;
    el.reset.textContent = L().reset;
    if (phase !== "idle" && current && idx < program.length) idx++;
    phase = "idle"; running = false; left = 0; current = null; startedAt = null;
    saveProg(); paint(); commit(); fetchProgram();
  });

  el.prevTalk.addEventListener("click", function () {
    if (phase !== "idle" || idx <= 0) return;
    idx--; saveProg(); paint(); commit();
  });
  el.nextTalk.addEventListener("click", function () {
    if (phase !== "idle" || idx >= program.length) return;
    idx++; saveProg(); paint(); commit();
  });

  /* ---- settings panel ---- */
  var limits = { talk: [1, 90], talkBell: [0, 30], qa: [0, 60], qaBell: [0, 30], size: [60, 140] };

  function syncPanel() {
    var t = L();
    document.documentElement.lang = S.lang;
    el["s-title"].textContent = t.sTitle;
    el["s-lang"].innerHTML = t.lang;
    el["s-talk"].innerHTML = t.talkRow;
    el["s-talkBell"].innerHTML = t.talkBellRow;
    el["s-qa"].innerHTML = t.qaRow;
    el["s-qaBell"].innerHTML = t.qaBellRow;
    el["s-size"].innerHTML = t.sizeRow;
    el["s-sound"].innerHTML = t.soundRow;
    el["s-auto"].innerHTML = t.autoRow;
    el["s-note"].textContent = t.note;
    el.close.textContent = t.close;
    el.test.textContent = t.test;
    el["h-title"].textContent = t.hTitle;
    el["h-body"].innerHTML = t.hBody + (HUB ? t.hNet(HUB.room) : "") + t.hCredit +
      "<p class='credit' style='margin-top:8px'>v" + VERSION + "</p>";
    el["h-test"].textContent = t.hTest;
    el["h-close"].textContent = t.hClose;
    el.open.textContent = t.settings;
    el.advance.textContent = t.toQa;
    if (Date.now() > resetArmed) el.reset.textContent = t.reset;

    ["talk", "talkBell", "qa", "qaBell"].forEach(function (k) {
      document.getElementById("v-" + k).textContent = S[k];
    });
    document.getElementById("v-size").textContent = S.size + "%";
    document.documentElement.style.setProperty("--clock-scale", S.size / 100);

    el["t-sound"].setAttribute("aria-pressed", String(S.sound));
    el["t-sound"].textContent = S.sound ? t.soundOn : t.soundOff;
    el["t-auto"].setAttribute("aria-pressed", String(S.auto));
    el["t-auto"].textContent = S.auto ? t.autoOn : t.autoOff;
    el["lang-ja"].setAttribute("aria-pressed", String(S.lang === "ja"));
    el["lang-en"].setAttribute("aria-pressed", String(S.lang === "en"));
    document.querySelectorAll("[data-preset]").forEach(function (b) {
      var p = b.dataset.preset.split(",").map(Number);
      b.textContent = t.preset(p[0], p[2]);
    });
  }

  function changed() { save(); syncPanel(); paint(); commit(); }

  document.querySelectorAll("[data-step]").forEach(function (b) {
    b.addEventListener("click", function () {
      var parts = b.dataset.step.split(","), k = parts[0], d = Number(parts[1]), lim = limits[k];
      S[k] = Math.max(lim[0], Math.min(lim[1], S[k] + d));
      changed();
    });
  });
  document.querySelectorAll("[data-preset]").forEach(function (b) {
    b.addEventListener("click", function () {
      var p = b.dataset.preset.split(",").map(Number);
      S.talk = p[0]; S.talkBell = p[1]; S.qa = p[2]; S.qaBell = p[3];
      changed();
    });
  });

  el["lang-ja"].addEventListener("click", function () { S.lang = "ja"; changed(); });
  el["lang-en"].addEventListener("click", function () { S.lang = "en"; changed(); });
  el["t-sound"].addEventListener("click", function () { S.sound = !S.sound; changed(); if (S.sound) bell(1); });
  el["t-auto"].addEventListener("click", function () { S.auto = !S.auto; changed(); });
  el.test.addEventListener("click", function () { audio(); bell(1); });
  el.open.addEventListener("click", function () { el.sheet.setAttribute("open", ""); syncPanel(); });
  el.close.addEventListener("click", function () { el.sheet.removeAttribute("open"); });
  el.help.addEventListener("click", function () { el["help-sheet"].setAttribute("open", ""); syncPanel(); });
  el["h-close"].addEventListener("click", function () { el["help-sheet"].removeAttribute("open"); });
  el["h-test"].addEventListener("click", function () { audio(); bell(1); });

  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); el.go.click(); }
    if (e.key === "n" || e.key === "N") { if (!el.advance.disabled) el.advance.click(); }
    if (e.key === "Escape") { el.sheet.removeAttribute("open"); el["help-sheet"].removeAttribute("open"); }
  });

  var local = null;
  try { local = JSON.parse(localStorage.getItem(STATE) || "null"); } catch (e) {}
  var resumed = applyState(local);
  syncPanel();
  paint();
  if (resumed) { toast(L().restored); if (running) keepAwake(); }

  if (HUB) {
    // another iPad may have been running this room: take its state if it is newer
    try {
      fetch(hubUrl("/rooms/" + encodeURIComponent(HUB.id)), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (snap) {
          setNet(true);
          var st = fromSnapshot(snap);
          if (st && (!local || (st.at || 0) > (local.at || 0) + 1500)) {
            if (applyState(st)) toast(L().restored);
            saveProg(); saveState(); paint();
          }
        })
        .catch(function () { setNet(false); })
        .then(function () { push(); fetchProgram(); });
    } catch (e) { push(); fetchProgram(); }
  }
})();
</script>
</body>
</html>
